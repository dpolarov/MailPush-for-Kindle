name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release archives with Docker
        env:
          VERSION: ${{ steps.release_tag.outputs.tag }}
        run: sh ./scripts/build.sh

      - name: Verify embedded version and archives
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          test -s dist/mailpush.koplugin.zip
          test -s dist/mailpush.koplugin-update.tar
          test -x dist/mailpush-linux-amd64
          ACTUAL_VERSION="$(dist/mailpush-linux-amd64 version | python3 -c 'import json,sys; print(json.load(sys.stdin)["message"])')"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          unzip -t dist/mailpush.koplugin.zip
          tar -tf dist/mailpush.koplugin-update.tar | grep -q '^mailpush.koplugin/bin/mailpush$'
          tar -tf dist/mailpush.koplugin-update.tar | grep -q '^mailpush.koplugin/main.lua$'
          echo "Verified embedded version: $ACTUAL_VERSION"

      - name: Rename install archive
        run: mv dist/mailpush.koplugin.zip dist/mailpush.koplugin-bilingual.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailpush-koplugin-${{ steps.release_tag.outputs.tag }}
          path: |
            dist/mailpush.koplugin-bilingual.zip
            dist/mailpush.koplugin-update.tar
          if-no-files-found: error

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already exists at $TAG_SHA, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/mailpush.koplugin-bilingual.zip dist/mailpush.koplugin-update.tar --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/mailpush.koplugin-bilingual.zip \
              dist/mailpush.koplugin-update.tar \
              --title "MailPush for KOReader $RELEASE_TAG" \
              --generate-notes
          fi

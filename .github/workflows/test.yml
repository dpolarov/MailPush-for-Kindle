name: test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 go build -trimpath -o /tmp/mailpush-arm ./cmd/mailpush
      - run: file /tmp/mailpush-arm | grep -q 'ARM'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve CI build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          version="v1.0.0-dev.${short_sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CI build version: $version"

      - name: Build installable plugin archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh ./scripts/build.sh

      - name: Verify embedded version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/mailpush-linux-amd64
          actual="$(./dist/mailpush-linux-amd64 version | python3 -c 'import json,sys; print(json.load(sys.stdin)["message"])')"
          echo "Embedded version: $actual"
          test "$actual" = "$EXPECTED_VERSION"

      - name: Verify install and update archives
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/mailpush.koplugin.zip
          test -s dist/mailpush.koplugin-update.tar
          unzip -t dist/mailpush.koplugin.zip
          unzip -l dist/mailpush.koplugin.zip | grep -q 'mailpush.koplugin/bin/mailpush'
          unzip -l dist/mailpush.koplugin.zip | grep -q 'mailpush.koplugin/updater_download.lua'
          tar -tf dist/mailpush.koplugin-update.tar | grep -qx 'mailpush.koplugin/bin/mailpush'
          tar -tf dist/mailpush.koplugin-update.tar | grep -qx 'mailpush.koplugin/main.lua'
          tar -tf dist/mailpush.koplugin-update.tar | grep -qx 'mailpush.koplugin/updater_download.lua'
          if tar -tf dist/mailpush.koplugin-update.tar | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path in update tar' >&2
            exit 1
          fi
          mv dist/mailpush.koplugin.zip dist/mailpush.koplugin-bilingual.zip

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: mailpush.koplugin-bilingual-${{ steps.version.outputs.version }}
          path: |
            dist/mailpush.koplugin-bilingual.zip
            dist/mailpush.koplugin-update.tar
          if-no-files-found: error
          retention-days: 30

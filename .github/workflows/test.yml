name: test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 go build -trimpath -o /tmp/mailpush-arm ./cmd/mailpush
      - run: file /tmp/mailpush-arm | grep -q 'ARM'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve CI build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          version="v1.0.0-dev.${short_sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CI build version: $version"

      - name: Build install and update archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh ./scripts/build.sh

      - name: End-to-end package verification
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh ./scripts/verify-package.sh "$VERSION"

      - name: Rename install archive
        run: mv dist/mailpush.koplugin.zip dist/mailpush.koplugin-bilingual.zip

      - name: Upload tested artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailpush.koplugin-bilingual-${{ steps.version.outputs.version }}
          path: |
            dist/mailpush.koplugin-bilingual.zip
            dist/mailpush.koplugin-update.tar
          if-no-files-found: error
          retention-days: 30

name: test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o /tmp/mailpush-armv7 ./cmd/mailpush
      - run: file /tmp/mailpush-armv7 | grep -q 'ARM'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build installable plugin archive
        run: sh ./scripts/build.sh

      - name: Verify plugin archive
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/mailpush.koplugin.zip
          unzip -t dist/mailpush.koplugin.zip
          unzip -l dist/mailpush.koplugin.zip | grep -q 'mailpush.koplugin/bin/mailpush'
          mv dist/mailpush.koplugin.zip dist/mailpush.koplugin-bilingual.zip

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: mailpush.koplugin-bilingual
          path: dist/mailpush.koplugin-bilingual.zip
          if-no-files-found: error
          retention-days: 30
